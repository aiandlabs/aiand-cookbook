# Runs each recipe against the live ai& API. A recipe validates its own output
# against the schema and exits non-zero on any error, so a passing step means
# the recipe works as written.
name: recipes

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Fork pull requests get no secrets, so they cannot call the API.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIAND_API_KEY: ${{ secrets.AIAND_API_KEY }}
    defaults:
      run:
        working-directory: python/structured-extraction
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements.txt
      - name: Structured extraction (OpenAI SDK)
        run: python openai_extraction.py
      - name: Structured extraction (Anthropic SDK)
        run: python anthropic_extraction.py

  typescript:
    # Fork pull requests get no secrets, so they cannot call the API.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AIAND_API_KEY: ${{ secrets.AIAND_API_KEY }}
    defaults:
      run:
        working-directory: typescript/structured-extraction
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run check
      - name: Structured extraction (OpenAI SDK)
        run: npm run start:openai
      - name: Structured extraction (Anthropic SDK)
        run: npm run start:anthropic
